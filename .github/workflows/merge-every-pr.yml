name: Auto-merge Drafts and PRs

on:
  pull_request:
    branches:
      # Your specific default branch
      - atonin-ai-feature-complete-16630192008413985243
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  auto-merge-all:
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Undraft and Merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Force the PR to be "Ready for Review" (removes Draft status)
          # We use "|| true" so it doesn't fail if the PR is already ready.
          gh pr ready ${{ github.event.pull_request.number }} || true
          
          # 2. Now Merge it
          gh pr merge ${{ github.event.pull_request.number }} --merge --auto
          
