name: Merge Every PR

on:
  pull_request:
    # This triggers on every new PR or update to a PR targeting main
    branches:
      - atonin-ai-feature-complete-16630192008413985243
    types: [opened, synchronize]

jobs:
  auto-merge-all:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Merge PR immediately
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Try to merge immediately. 
          # If checks are required, --auto will wait for them to pass first.
          gh pr merge ${{ github.event.pull_request.number }} --merge --auto || gh pr merge ${{ github.event.pull_request.number }} --merge
          
