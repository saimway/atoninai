name: Jules Auto-Merge
on:
  pull_request:
    types: [opened]

jobs:
  approve-and-merge:
    # Only run if the PR is created by the Jules bot
    if: github.actor == 'google-labs-jules'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Auto-Approve & Merge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
