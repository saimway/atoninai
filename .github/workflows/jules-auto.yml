name: Jules Auto-Merge
on:
  pull_request:
    types: [opened]

jobs:
  approve-and-merge:
    # Only run for Jules
    if: github.actor == 'google-jules[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Auto-Approve & Merge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
